<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026淮北市规上制造业企业产需信息汇编 · 在线检索</title>
<style>
  :root { --accent:#0d6efd; --bg:#f4f5f7; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:#222; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#fff; border-bottom:1px solid #e3e6ea; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; white-space:nowrap; }
  #q { flex:1; min-width:220px; padding:9px 12px; font-size:14px; border:1px solid #ccd2da; border-radius:8px; outline:none; }
  #q:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(13,110,253,.12); }
  button, .btn { padding:8px 12px; font-size:13px; border:1px solid #ccd2da; background:#fff; border-radius:8px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  #stat { font-size:12px; color:#666; }
  main { display:flex; height:calc(100% - 60px); }
  #side { width:330px; min-width:250px; overflow:auto; background:#fff; border-right:1px solid #e3e6ea; }
  .res-item { display:flex; gap:8px; padding:9px 10px; border-bottom:1px solid #f0f2f5; cursor:pointer; }
  .res-item:hover { background:#f3f7ff; }
  .res-item.active { background:#e7f0ff; }
  .res-item img { width:52px; height:70px; object-fit:cover; border:1px solid #e0e3e8; background:#fafafa; }
  .res-item .info { flex:1; min-width:0; }
  .pt { font-size:13px; font-weight:600; }
  .ent { font-size:12px; color:#0d6efd; margin-top:1px; word-break:break-all; }
  .cnt { font-size:11px; color:#999; margin:2px 0; }
  .snip { font-size:11.5px; color:#555; line-height:1.45; word-break:break-all; }
  .snip mark { background:#ffe066; }
  #viewer { flex:1; display:flex; flex-direction:column; min-width:0; }
  #toolbar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#fff; border-bottom:1px solid #e3e6ea; flex-wrap:wrap; }
  #pgInput { width:64px; padding:5px 6px; border:1px solid #ccd2da; border-radius:6px; text-align:center; }
  #stageWrap { flex:1; overflow:auto; background:#e9ebee; padding:16px; text-align:center; }
  #stage { position:relative; display:inline-block; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.15); }
  #pageimg { display:block; width:100%; height:auto; }
  #boxes { position:absolute; inset:0; pointer-events:none; }
  .hlbox { position:absolute; background:rgba(255,193,7,.38); border:1.5px solid #f0a000; border-radius:2px; }
  #thumbs { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); overflow:auto; padding:20px; z-index:50; }
  #thumbs .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; max-width:1200px; margin:0 auto; }
  #thumbs img { width:100%; border:2px solid transparent; cursor:pointer; background:#fff; }
  #thumbs img:hover { border-color:#ffe066; }
  #thumbs .tip { color:#fff; text-align:center; font-size:13px; margin-bottom:12px; }
  .entpanel { padding:8px 10px; }
  .entpanel input { width:100%; padding:7px 9px; border:1px solid #ccd2da; border-radius:7px; margin-bottom:8px; }
  .entrow { padding:6px 8px; border-bottom:1px solid #f2f4f7; cursor:pointer; font-size:12.5px; }
  .entrow:hover { background:#f3f7ff; }
  .entrow b { color:#0d6efd; font-weight:600; }
  .empty { padding:20px; color:#999; font-size:13px; text-align:center; }
  @media (max-width:820px) {
    main { flex-direction:column; height:auto; }
    #side { width:100%; max-height:45vh; border-right:none; border-bottom:1px solid #e3e6ea; }
  }

  #textPanel { display:none; background:#fff; border-radius:10px; box-shadow:0 2px 14px rgba(0,0,0,.12); margin-bottom:12px; text-align:left; }
  #textHead { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid #eee; font-size:13px; color:#333; }
  #textHead button { border:1px solid #d0d7de; background:#f7f8fa; border-radius:6px; padding:3px 10px; font-size:12px; cursor:pointer; }
  #textBody { padding:10px 12px; white-space:pre-wrap; word-break:break-all; font-size:14px; line-height:1.8; max-height:44vh; overflow:auto; }
  #textBody mark.hl { background:#ffe066; padding:0 1px; }
  .titleWrap { display:flex; flex-direction:column; }
  .subnote { font-size:11px; color:#8a94a6; margin-top:3px; line-height:1.4; }
  #textBody .secTitle { font-weight:bold; color:#0d6efd; font-size:13px; margin:10px 0 4px; }
</style>
</head>
<body>
<header>
  <div class="titleWrap"><h1>产需信息汇编 · 在线检索</h1><div class="subnote">注：为方便工作需要，特制定本链接，内容仅做参考，有疑问请联系。作者：树莓ge</div></div>
  <input id="q" placeholder="输入企业名称 / 产品 / 原材料 / 关键词，如：中煤远大、水泥、轴承、联系人…">
  <button id="btnEnt">企业名录</button>
  <button id="btnThumb">缩略图</button>
  <span id="stat"></span>
</header>

<main>
  <aside id="side">
    <div id="results"><div class="empty">输入关键词开始检索；点击结果即可跳转到对应页面并高亮。</div></div>
  </aside>
  <section id="viewer">
    <div id="toolbar">
      <button id="prev">‹ 上一页</button>
      <input id="pgInput" type="number" min="1" max="527">
      <span id="pgLabel" style="font-size:13px;color:#555"></span>
      <button id="next">下一页 ›</button>
      <button id="btnFit">适应宽度</button>
      <button id="btnZoomIn">＋</button>
      <button id="btnZoomOut">－</button>
      <label style="font-size:13px;color:#555"><input type="checkbox" id="hlToggle" checked> 高亮命中</label>
      <button id="btnLink">复制企业简介</button>
      <span id="copyTip" style="font-size:12px;color:#0a0"></span>
    </div>
    <div id="stageWrap">
  <div id="textPanel" style="display:none">
    <div id="textHead"><span id="textHeadMain"></span><button id="btnTextToggle" type="button">收起文字</button></div>
    <div id="textBody"></div>
  </div>
      <div id="stage">
        <img id="pageimg" alt="page">
        <div id="boxes"></div>
        <div id="loadTip" style="display:none;text-align:center;padding:40px 12px;color:#667;font-size:14px">页面加载中…</div>
      </div>
    </div>
  </section>
</main>

<div id="thumbs"><div class="tip">点击任意页跳转（Esc 关闭）</div><div class="grid" id="thumbGrid"></div></div>

<!-- 数据动态加载 -->
<script>
var PAGES = window.BOOK_DATA || [];
var META = window.BOOK_META || {};
var TOTAL = PAGES.length;
PAGES.forEach(function (p) { p.nt = String(p.t || '').replace(/\s+/g, ''); });
var IMG = function (p) { return 'img/' + String(p).padStart(4, '0') + '.jpg'; };
var CDN_IMG = function (p) { return "https://cdn.jsdelivr.net/gh/1206642927/chanshu@master/img/" + String(p).padStart(4, "0") + ".jpg"; };
var cur = 0, curTokens = [], scaleFit = true;

function $(id) { return document.getElementById(id); }
function normOf(s) { return String(s || '').replace(/\s+/g, ''); }
function esc(s) { return String(s || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function label(p) {
  if (p === 0) return '封面';
  if (p === 526) return '封底';
  var printed = p - 20;
  return '第 ' + printed + ' 页（图' + p + '）';
}
function entOf(p) { return (PAGES[p] && PAGES[p].n) || ''; }
function chapOf(p) { return (PAGES[p] && PAGES[p].c) || ''; }
function parkOf(p) { return (PAGES[p] && PAGES[p].k) || ''; }

// 预计算每页归一化文本（含企业名，便于按名称检索）
for (var i = 0; i < TOTAL; i++) {
  var pg = PAGES[i];
  pg.nt = normOf((pg.n || '') + (pg.c || '') + (pg.k || '') + (pg.t || ''));
}

function countOcc(hay, needle) {
  if (!needle) return 0;
  var n = 0, idx = 0;
  while ((idx = hay.indexOf(needle, idx)) >= 0) { n++; idx += needle.length; }
  return n;
}
function snippet(page, tokens) {
  var t = page.t || '';
  var nt = normOf(t);
  for (var k = 0; k < tokens.length; k++) {
    var pos = nt.indexOf(tokens[k]);
    if (pos >= 0) {
      var s = Math.max(0, pos - 30);
      var seg = ('…' + nt.slice(s, pos + 60) + '…');
      return seg.replace(new RegExp('(' + esc(tokens[k]) + ')', 'g'), '<mark>$1</mark>');
    }
  }
  return nt.slice(0, 80);
}

function escHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
function markLine(line) {
  var s = escHtml(line);
  (curTokens || []).forEach(function (t) {
    if (!t) return;
    s = s.split(t).join('\u0001' + t + '\u0002');
  });
  return s.split('\u0001').join('<mark class="hl">').split('\u0002').join('</mark>');
}
var textOpen = true;
function renderText(p) {
  var page = PAGES[p] || {};
  var panel = $('textPanel');
  if (!panel) return;
  panel.style.display = 'block';
  $('textHeadMain').textContent = '第 ' + p + ' 页' + (page.n ? ' · ' + page.n : '') + (page.c ? ' · ' + page.c : '');
  var html = '';
  if (page.j) html += '<div class="secTitle">企业简介</div><div>' + markLine(page.j) + '</div>';
  if (page.pd) html += '<div class="secTitle">主要产品</div><div>' + markLine(page.pd).split('\n').join('<br>') + '</div>';
  $('textBody').innerHTML = html || '<span style="color:#999">（本页暂无文字资料，请看下方原图）</span>';
  $('textBody').style.display = textOpen ? 'block' : 'none';
  $('btnTextToggle').textContent = textOpen ? '收起文字' : '展开文字';
}
function doSearch() {
  var q = $('q').value.trim();
  var tokens = q.split(/\s+/).filter(Boolean).map(normOf);
  curTokens = tokens;
  var out = $('results');
  out.innerHTML = '';
  if (!tokens.length) { $('stat').textContent = ''; return; }
  var matches = [];
  for (var p = 0; p < TOTAL; p++) {
    var page = PAGES[p];
    if (!page || !page.n) continue;
    var ok = true, cnt = 0;
    for (var i = 0; i < tokens.length; i++) {
      var c = countOcc(page.nt, tokens[i]);
      if (c === 0) { ok = false; break; }
      if (i === 0) cnt = c;
    }
    if (ok) matches.push({ p: p, cnt: cnt });
  }
  $('stat').textContent = '命中 ' + matches.length + ' 页';
  var cap = 300;
  matches.slice(0, cap).forEach(function (m) {
    var page = PAGES[m.p];
    var el = document.createElement('div');
    el.className = 'res-item';
    el.innerHTML = '<img loading="lazy" src="' + IMG(m.p) + '">' +
      '<div class="info"><div class="pt">' + label(m.p) + ' · 命中 ' + m.cnt + ' 处</div>' +
      (page.n ? '<div class="ent">' + page.n + '</div>' : '') +
      '<div class="snip">' + snippet(page, tokens) + '</div></div>';
    el.onclick = function () { showPage(m.p); };
    out.appendChild(el);
  });
  if (!matches.length) out.innerHTML = '<div class="empty">没有找到，换个关键词试试（建议用企业名核心 2~4 个字）</div>';
  if (matches.length > cap) {
    var more = document.createElement('div');
    more.style.cssText = 'padding:10px;color:#888;font-size:12px;text-align:center';
    more.textContent = '仅显示前 ' + cap + ' 页，请输入更精确的关键词';
    out.appendChild(more);
  }
}

function showPage(p) {
  p = Math.max(0, Math.min(TOTAL - 1, p));
  cur = p;
  renderText(p);
  var img = $('pageimg');
  img.style.display = '';
  img.style.width = scaleFit ? '100%' : (img._zoom || '100%');
  var tip = $('loadTip');
  if (tip) { tip.style.display = 'block'; tip.style.cursor = ''; tip.textContent = '页面加载中…'; tip.onclick = null; }
  img.onload = function () { if (tip) tip.style.display = 'none'; img.style.visibility = 'visible'; ensureBoxes(cur, drawBoxes); preloadNear(cur); };
  img.onerror = function () {
    if (!img._cdnTried) {
      img._cdnTried = true;
      if (tip) tip.textContent = '主站较慢，自动切换加速源…';
      img.src = CDN_IMG(p);
    } else {
      img._cdnTried = false;
      if (tip) { tip.style.display = 'block'; tip.style.cursor = 'pointer'; tip.textContent = '网络较慢，图片未加载 —— 点这里重试'; tip.onclick = function () { showPage(p); }; }
    }
  };
  img._cdnTried = false;
  img.style.visibility = 'hidden';
  img.src = IMG(p);
  $('pgInput').value = p;
  $('pgLabel').textContent = label(p) + (entOf(p) ? ' · ' + entOf(p) : '');
  location.hash = 'p=' + p;
  // 侧栏高亮
  var items = document.querySelectorAll('.res-item');
  for (var i = 0; i < items.length; i++) items[i].classList.toggle('active', +items[i].dataset.p === p);
}

function preloadNear(p) {
  var q = p + 1;
  if (q >= TOTAL) return;
  var im = new Image();
  im.src = IMG(q);
}

function ensureBoxes(p, cb) {
  if (window.BOXES && window.BOXES[p]) { cb(); return; }
  var pad = String(p).padStart(4, '0');
  var urls = ['https://cdn.jsdelivr.net/gh/1206642927/chanshu@92da2528e35c2b4a384b3ada208663f3e9373077/boxes/' + pad + '.js', 'boxes/' + pad + '.js'];
  var i = 0;
  function tryNext() {
    if (i >= urls.length) { cb(); return; }
    var s = document.createElement('script');
    s.src = urls[i++];
    s.onload = function () { cb(); };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
}
function drawBoxes() {
  var box = $('boxes');
  box.innerHTML = '';
  if (!$('hlToggle').checked || !curTokens.length) return;
  var page = PAGES[cur];
  var img = $('pageimg');
  var sw = img.clientWidth / 1000;   // 高亮框已归一化到 1000px 基准
  var hits = [];
  (((window.BOXES && window.BOXES[cur]) || page.w || [])).forEach(function (w) {
    var txt = normOf(w[4]);
    for (var k = 0; k < curTokens.length; k++) {
      if (curTokens[k] && txt.indexOf(curTokens[k]) >= 0) { hits.push(w); break; }
    }
  });
  hits.slice(0, 400).forEach(function (w) {
    var d = document.createElement('div');
    d.className = 'hlbox';
    d.style.left = (w[0] * sw) + 'px';
    d.style.top = (w[1] * sw) + 'px';
    d.style.width = ((w[2] - w[0]) * sw) + 'px';
    d.style.height = ((w[3] - w[1]) * sw) + 'px';
    box.appendChild(d);
  });
}

// 企业名录
function buildEntList() {
  var list = [];
  for (var p = 0; p < TOTAL; p++) if (PAGES[p].n) list.push({ p: p, n: PAGES[p].n, c: PAGES[p].c });
  var out = $('results');
  out.innerHTML = '<div class="entpanel"><input id="entFilter" placeholder="输入企业名筛选…"><div id="entList"></div></div>';
  var render = function (kw) {
    var box = document.getElementById('entList');
    box.innerHTML = '';
    var k = normOf(kw);
    var n = 0;
    list.forEach(function (it) {
      if (k && normOf(it.n).indexOf(k) < 0) return;
      n++;
      var d = document.createElement('div');
      d.className = 'entrow';
      d.innerHTML = '<b>' + it.n + '</b>' + (it.c ? ' <span style="color:#999">· ' + it.c.replace('产业', '') + '</span>' : '');
      d.onclick = function () { showPage(it.p); window.scrollTo(0, 0); };
      box.appendChild(d);
    });
    if (!n) box.innerHTML = '<div class="empty">没有匹配的企业</div>';
  };
  render('');
  document.getElementById('entFilter').addEventListener('input', function () { render(this.value); });
}

// 缩略图
function buildThumbs() {
  var g = $('thumbGrid');
  if (g.childElementCount) { $('thumbs').style.display = 'block'; return; }
  for (var p = 0; p < TOTAL; p++) {
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.src = IMG(p);
    img.title = label(p);
    img.dataset.p = p;
    img.onclick = function () { showPage(+this.dataset.p); $('thumbs').style.display = 'none'; };
    g.appendChild(img);
  }
  $('thumbs').style.display = 'block';
}

// 事件绑定
$('q').addEventListener('input', function () { clearTimeout(window._t); window._t = setTimeout(doSearch, 220); });
$('btnEnt').addEventListener('click', buildEntList);
$('btnThumb').addEventListener('click', buildThumbs);
$('thumbs').addEventListener('click', function (e) { if (e.target === this) this.style.display = 'none'; });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') $('thumbs').style.display = 'none';
  if (document.activeElement === $('q') || document.activeElement.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') showPage(cur - 1);
  if (e.key === 'ArrowRight') showPage(cur + 1);
});
$('prev').addEventListener('click', function () { showPage(cur - 1); });
$('next').addEventListener('click', function () { showPage(cur + 1); });
$('pgInput').addEventListener('change', function () { showPage(parseInt(this.value, 10) || 0); });
$('btnFit').addEventListener('click', function () { scaleFit = true; $('pageimg').style.width = '100%'; drawBoxes(); });
$('btnZoomIn').addEventListener('click', function () {
  scaleFit = false;
  var img = $('pageimg');
  img._zoom = (parseInt(img._zoom || '100', 10) + 25) + '%';
  img.style.width = img._zoom; drawBoxes();
});
$('btnZoomOut').addEventListener('click', function () {
  scaleFit = false;
  var img = $('pageimg');
  img._zoom = Math.max(25, parseInt(img._zoom || '100', 10) - 25) + '%';
  img.style.width = img._zoom; drawBoxes();
});
$('hlToggle').addEventListener('change', drawBoxes);
$('btnLink').addEventListener('click', function () {
  var page = PAGES[cur] || {};
  var txt = (page.n ? page.n + '\n\n' : '') + (page.j ? '【企业简介】\n' + page.j + '\n\n' : '') + (page.pd ? '【主要产品】\n' + page.pd : '');
  if (!txt) txt = page.n || ('第' + cur + '页');
  var done = function () { $('copyTip').textContent = '已复制企业简介 ✓'; setTimeout(function () { $('copyTip').textContent = ''; }, 2500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { prompt('复制企业简介（选全复制）', txt); });
  else prompt('复制企业简介（选全复制）', txt);
});
$('pageimg').addEventListener('load', drawBoxes);
window.addEventListener('hashchange', function () {
  var m = location.hash.match(/p=(\d+)/);
  if (m) showPage(parseInt(m[1], 10));
});

// 初始化
(function init() {
  var m = location.hash.match(/p=(\d+)/);
  if (m) { showPage(parseInt(m[1], 10)); }
  else { var im0 = $('pageimg'); if (im0) { im0.removeAttribute('src'); im0.style.display = 'none'; } var tp = $('loadTip'); if (tp) { tp.style.display = 'block'; tp.textContent = '在上方输入关键词开始检索（如：铝 / 水泥 / 轴承）'; } }
})();

var bt = $('btnTextToggle');
if (bt) bt.addEventListener('click', function () { textOpen = !textOpen; renderText(cur); });
// 数据加载：CDN 优先，失败回退本地；就绪后开放搜索
(function loadData() {
  var urls = ['https://cdn.jsdelivr.net/gh/1206642927/chanshu@92da2528e35c2b4a384b3ada208663f3e9373077/data.js', 'https://cdn.jsdelivr.net/gh/1206642927/chanshu@master/data.js', 'data.js'];
  var i = 0;
  var tp = $('loadTip');
  function setTip(t, hide) {
    if (!tp) return;
    tp.style.display = hide ? 'none' : 'block';
    tp.textContent = t;
  }
  setTip('正在加载检索数据（约1MB，仅首次需要）…');
  function ready() {
    if (!(window.BOOK_META && window.BOOK_META.version >= 5)) { tryNext(); return; }
    PAGES = window.BOOK_DATA || [];
    META = window.BOOK_META || {};
    TOTAL = PAGES.length;
    PAGES.forEach(function (p) { p.nt = String(p.t || '').replace(/\s+/g, ''); });
    setTip('数据就绪 ✓ 输入关键词开始搜索（如：铝 / 水泥 / 轴承）');
    setTimeout(function () { if (!cur) setTip('', true); }, 3000);
  }
  function tryNext() {
    if (i >= urls.length) { setTip('数据加载失败：请检查网络后刷新页面重试'); return; }
    var s = document.createElement('script');
    s.src = urls[i++];
    s.onload = ready;
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>
</body>
</html>
